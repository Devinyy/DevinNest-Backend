# --- 后端 API (devinnest-api.top) 配置 (8443 端口) ---
# 注意：本配置文件仅用于宿主机 Nginx 代理后端 API。
# 前端服务 (80/443) 由 Docker 容器或其他 Nginx 实例接管，在此处不进行配置以避免端口冲突。

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name devinnest-api.top;

    # SSL 配置
    # 请确保 SSL 证书文件路径正确
    ssl_certificate /etc/ssl/certs/devinnest.top.pem; 
    ssl_certificate_key /etc/ssl/private/devinnest.top.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Gzip
    gzip on;
    gzip_types application/json;

    location / {
        # 转发到本地 Docker 后端服务 (端口 8000)
        # CORS 由后端应用 (FastAPI) 处理，Nginx 不再重复添加头部
        proxy_pass http://127.0.0.1:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 增加超时时间防止大文件上传中断
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # 如果后端有静态文件需求
    location /static/ {
        alias /root/devinnest-backend/static/;
        expires 30d;
    }
}
